name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            java: "21"
            javafx_platform: win

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify DB environment (secrets vs classpath)
        run: |
          if [ -n "${DB_URL}" ] || [ -n "${DB_USER}" ] || [ -n "${DB_PASSWORD}" ]; then
            if [ -z "${DB_URL}" ] || [ -z "${DB_USER}" ] || [ -z "${DB_PASSWORD}" ]; then
              echo "::error::Partial DB config: set all three secrets DB_URL, DB_USER, and DB_PASSWORD, or remove them and rely on application.config."
              exit 1
            fi
            echo "DB_URL / DB_USER / DB_PASSWORD are set (values not printed)."
          else
            echo "::notice::No DB_* secrets in env; build will use db.url / db.user / db.password from application.config if present."
          fi

      - name: Run tests and coverage
        working-directory: open-robotics
        run: mvn "-Djavafx.platform=${{ matrix.javafx_platform }}" clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: open-robotics/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: open-robotics/target/site/jacoco/**
          if-no-files-found: ignore
